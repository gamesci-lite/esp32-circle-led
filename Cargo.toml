[package]
name = "esp32-circle-led"
version = "0.1.0"
authors = ["dwb"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "esp32-circle-led"
harness = false

[profile.release]
opt-level = 1          # 降低优化 — LLVM opt-level=s/z 生成过于激进的 l32r 引用, 降为 1 避开
lto = "off"
codegen-units = 1

[profile.dev]
debug = true
opt-level = "z"
lto = "off"
codegen-units = 1

# 注: 曾有 [patch.crates-io] 把 esp-idf-* 指到 github master —— 已移除。
# crates.io 官方版本 (sys 0.37.2 / hal 0.46.2 / svc 0.52.1) 原生支持 ESP-IDF v5.5.x，
# 且构建机访问不了 github，git patch 只会让 cargo 挂死。

[dependencies]
log = "0.4"
anyhow = "1"
# 暂时去掉 esp-idf-svc — 它的复杂泛型异步原语 (Waitable/Unblocker/RawCstr) 触发 Xtensa nightly 的
# l32r: misaligned literal target 链接错误. 改用 esp-idf-sys 直调 ESP-IDF C API + 手写最小 log.
# esp-idf-svc = { version = "0.52.1", features = ["critical-section"] }
# esp-idf-hal 也移除 (2026-08-19): 它 0.46.2 仍用 legacy I2C 驱动 (i2c_driver_install),
# 与 CO5300 驱动用的新 I2C master (driver_ng) 冲突 → "CONFLICT! driver_ng" 运行期 abort.
esp-idf-sys = { version = "0.37.2", features = ["binstart"] }

# Slint UI: 暂时禁用 — memmap2 0.9.11 依赖 POSIX libc::* 常量, esp-idf musl 不兼容.
# 等下一轮单独验证 Slint 在 ESP32-S3 上的嵌入式集成方案.
# 参考: https://github.com/slint-ui/slint/issues/...
# slint = { version = "1", default-features = false, features = ["std", "unsafe-single-threaded"] }

# PSRAM allocator — 466x466x2 = 434KB framebuffer 必须放 PSRAM
esp-alloc = "0.6"

# GUI 渲染 (M1): 纯 Rust no_std, m5stamp 项目同工具链已验证可编
embedded-graphics = "0.8"
profont = "0.7"

# GT911 触摸 (I2C) — 备选 crate: abayomi185/gt911, jessebraham/tt21100
# 第一阶段只点亮屏, 触摸先留 TODO

[build-dependencies]
embuild = "0.33"
# slint-build = "1"

# CO5300 驱动复用 C 路线已点亮的乐鑫官方组件 (vendor 自 esp_lcd_co5300 v2.1.0)
# esp-idf-sys 把它加进 IDF 构建并对 include/esp_lcd_co5300.h 生成 bindgen 绑定
[package.metadata.esp-idf-sys]
extra_components = [
    { component_dirs = ["vendor/esp_lcd_co5300"], bindings_header = "vendor/esp_lcd_co5300/include/esp_lcd_co5300.h" },
]

# ── Feature 架构: 应用入口 feature 驱动 (见 docs/ROADMAP.md) ──
# 裁剪示例: cargo build --release --no-default-features --features app-calculator
[features]
default = ["all-apps"]
all-apps = ["app-squareline", "app-calculator", "app-drawpanel", "app-aichats"]
app-squareline = []   # 关于/信息页
app-calculator = []   # 计算器 (M4 实体化)
app-drawpanel  = []   # 触摸画板 (M3 触摸前置)
app-aichats    = []   # AI 对话 (M2 WiFi 前置)
